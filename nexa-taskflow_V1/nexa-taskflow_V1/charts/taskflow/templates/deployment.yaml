apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-taskflow
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-taskflow
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-taskflow
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8085
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
