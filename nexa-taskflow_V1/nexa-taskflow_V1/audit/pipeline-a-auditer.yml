# Pipeline fourni pour le mini-audit (TP 6).
# Il "fonctionne", mais présente de nombreux manques de sécurité.
# Consigne : identifier les problèmes, évaluer le risque, proposer une correction.
# Ce fichier n'est volontairement PAS placé dans .github/workflows/.

name: release

on:
  pull_request_target:
  push:
    branches: [main]

permissions: write-all

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Afficher la PR
        run: echo "Construction de la PR : ${{ github.event.pull_request.title }}"

      - uses: actions/setup-python@main

      - run: pip install -r requirements.txt
      - run: pytest || true

      - name: Scan de vulnérabilités
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          exit-code: "0"

      - name: Connexion au registre
        run: |
          echo "Login avec ${{ secrets.REGISTRY_TOKEN }}"
          docker login -u nexa -p ${{ secrets.REGISTRY_TOKEN }} registry.example.com

      - name: Build et push
        run: |
          docker build -t registry.example.com/nexa/taskflow:latest .
          docker push registry.example.com/nexa/taskflow:latest

      - name: Déploiement
        uses: some-org/deploy-action@master
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
